name: agriapp
description: Flutter app para login y visualización de datos del agricultor.
publish_to: 'none'
version: 1.0.20261004103230+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  file_picker: ^10.3.10
  uuid: ^4.5.3
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  google_fonts: ^6.3.2
  sqflite: ^2.3.0
  path: ^1.8.3
  intl: ^0.19.0
  flutter_linkify: ^6.0.0
  package_info_plus: ^8.0.0
  share_plus: ^10.0.0
  flutter_native_splash: ^2.3.5 # <--- TRASLADADO AQUÍ

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_native_splash:
  color: "#F5F5F5"
  image: "assets/logo_maximizada.png"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_maximizada.png"
  remove_alpha_ios: true 
  adaptive_icon_background: "f5f5f5"